name: Robo Checkout Nuvemshop

on:
  workflow_dispatch: # Mantém o botão para você rodar manualmente quando quiser
  schedule:
    # Minuto 0, Hora 8 (UTC) -> Equivale a 05:00 da manhã no Brasil
    # Dias da semana: 0 (Domingo) e 3 (Quarta-feira)
    - cron: '0 8 * * 0,3'

jobs:
  scraping_distribuido:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        chunk: [1, 2, 3, 4] # Divide o trabalho em 4 máquinas simultâneas

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Google Chrome e Limpar Driver Velho
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          sudo rm -f /usr/bin/chromedriver

      - name: Instalar Bibliotecas
        run: pip install -r requirements.txt

      - name: Rodar o Robo (Lote ${{ matrix.chunk }})
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        # O -u faz com que o texto da tela preta apareça instantaneamente (sem buffer)
        run: python -u scraper.py --chunk ${{ matrix.chunk }} --total-chunks 4
