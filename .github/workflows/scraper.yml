yaml
name: Robo Checkout Nuvemshop

on:
  workflow_dispatch: # Permite rodar manualmente clicando no botão

jobs:
  scraping_distribuido:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        chunk: [1, 2, 3, 4] # Aqui divide em 4 maquinas (pode aumentar se precisar)

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Instalar Bibliotecas do Python
        run: pip install -r requirements.txt

      - name: Rodar o Robo (Parte ${{ matrix.chunk }})
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: python scraper.py --chunk ${{ matrix.chunk }} --total-chunks 4
