name: Robo Checkout Nuvemshop

on:
  workflow_dispatch: # Permite que você clique num botão "Run workflow" para rodar quando quiser

jobs:
  scraping_distribuido:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        chunk: [1, 2, 3, 4] # Aqui divide o trabalho em 4 máquinas simultâneas

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Instalar Bibliotecas
        run: pip install -r requirements.txt

      - name: Rodar o Robo (Lote ${{ matrix.chunk }})
        env:
          # Isso injeta a sua credencial do Google Sheets com segurança no Python
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: |
          python scraper.py --chunk ${{ matrix.chunk }} --total-chunks 4
